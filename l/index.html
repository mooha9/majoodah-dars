<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>درس تفاعلي — مجودة</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Baloo+Bhaijaan+2:wght@600;700;800&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap">
<style>
:root{--ink:#0b3d40;--muted:#5b7476;--line:#d9e6e6;--paper:#f5f9f8;--card:#fff;--teal:#0a6d73;--teal-soft:#e3f1f0;--must:#e1a23a;--must-soft:#fbf1df;--ok:#1f7a43;--ok-s:#e4f4ea;--bad:#c4513f;--bad-s:#fbe9e7;
 --f-d:"Baloo Bhaijaan 2","IBM Plex Sans Arabic",Tahoma,sans-serif;--f-b:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;--fs:1}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--ink:#e4efee;--muted:#9db3b2;--line:#24393a;--paper:#0d1717;--card:#132222;--teal:#4fb7b5;--teal-soft:#16302f;--must-soft:#2c2414;--ok-s:#132b1e;--bad-s:#341b19;color-scheme:dark}}
:root[data-theme=dark]{--ink:#e4efee;--muted:#9db3b2;--line:#24393a;--paper:#0d1717;--card:#132222;--teal:#4fb7b5;--teal-soft:#16302f;--must-soft:#2c2414;--ok-s:#132b1e;--bad-s:#341b19;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-b);font-size:calc(16px * var(--fs));line-height:1.7;display:flex;flex-direction:column}
body.pres{--fs:1.35}
h1,h2,h3{font-family:var(--f-d);margin:0;line-height:1.35}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--must);outline-offset:2px}
.bar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--card)}
.bar .t{font-family:var(--f-d);font-weight:700;font-size:16px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{height:5px;background:var(--line)}.prog i{display:block;height:100%;background:var(--teal);transition:width .3s}
.ibtn{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:5px 11px;cursor:pointer;font-size:13px;white-space:nowrap}
main{flex:1;overflow:auto;padding:22px 12px 30px;background:radial-gradient(circle at 30% 0,#e9e3d6,#d8cfbd);perspective:1800px}
.scr{max-width:900px;margin:0 auto;background:#fffdf8;color:#2b2a26;border-radius:6px 14px 14px 6px;box-shadow:0 1px 0 #e7dfcf,0 18px 40px rgba(60,45,20,.18),inset 14px 0 18px -14px rgba(60,45,20,.25);padding:28px 30px 34px;position:relative;font-family:"Noto Naskh Arabic","IBM Plex Sans Arabic",serif;transform-origin:right center}
.scr.turn{animation:turn .45s ease}@keyframes turn{from{transform:rotateY(-14deg);opacity:.2}to{transform:none;opacity:1}}
.chap{display:flex;justify-content:space-between;font-family:var(--f-b);font-size:12px;color:#8a7d63;border-bottom:1px solid #eee4d1;padding-bottom:8px;margin-bottom:14px}
.pgno{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-family:var(--f-b);font-size:12px;color:#a2967c}
.formula{border:1px solid #d9cfba;background:#fbf6ea;border-radius:10px;padding:14px 16px;margin-top:14px;text-align:center;direction:ltr;font-family:"Cambria Math","Times New Roman",serif;font-size:1.35em;color:#1f1d19}
.margin{font-family:"IBM Plex Sans Arabic",sans-serif;font-weight:600;color:#b0651c;font-size:1.05em;border-inline-start:2px dashed #e4c79a;padding:4px 12px;margin-top:14px}

.pred{border:1px solid #e3d8c2;border-radius:12px;padding:12px 16px;margin-top:16px;background:#fff}
.pred small{color:#8a7d63;font-family:var(--f-b)}.pred h3{font-size:1.1em;margin:4px 0 8px;font-family:"Noto Naskh Arabic",serif}
.pred label{display:flex;gap:8px;align-items:center;padding:4px 0;cursor:pointer}.pred input{width:18px;height:18px;accent-color:#0a6d73}
.flap{margin-top:10px;position:relative;border-radius:10px;overflow:hidden;min-height:64px;background:#f3f8f2;border:1px solid #cfe3cf}
.flap .ans{padding:12px 14px}.flap .cov{position:absolute;inset:0;background:repeating-linear-gradient(45deg,#fbf1d6,#fbf1d6 10px,#f7e8c2 10px,#f7e8c2 20px);display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;font-weight:700;color:#6b5420;transition:transform .5s ease;transform-origin:top}
.flap.open .cov{transform:rotateX(85deg) translateY(-30px);opacity:0;pointer-events:none}
.scr .ex{background:#f1f7f6}.scr{color-scheme:light;--ink:#0b3d40;--muted:#5b7476;--line:#d9e6e6;--card:#fff;--teal:#0a6d73;--teal-soft:#e3f1f0;--ok:#1f7a43;--ok-s:#e4f4ea;--bad:#c4513f;--bad-s:#fbe9e7}.scr .s3{background:#fff;border-color:#e3d8c2}.scr .s3h{color:#2b2a26}.scr .s3h span,.scr .s3c{color:#7a7262}.scr .kick{background:#f6ead0;color:#5a4a26}.scr .opt,.scr .tf,.scr .chipb,.scr .vc{background:#fff;color:#2b2a26}.scr .tn{font-family:var(--f-b)}.scr .qr{background:#fff;border-color:#e3d8c2;color:#2b2a26}.scr .qr .nm{color:#7a7262!important}
@media(max-width:600px){.scr{padding:20px 16px 34px}}
@media (prefers-color-scheme:dark){main{background:#151a19}.scr{background:#fbf8f1}}
.kick{display:inline-block;background:var(--must-soft);color:var(--ink);border-radius:99px;padding:2px 14px;font-weight:700;font-size:.85em;margin-bottom:10px}
.scr h2{font-size:1.8em;margin-bottom:12px}
.scr ul.b{padding:0 1.2em;margin:0}.scr ul.b li{margin:.45em 0;font-size:1.15em}
.ex{background:var(--teal-soft);border-radius:14px;padding:12px 16px;margin-top:16px}.ex b{color:var(--teal)}
.tn{border-inline-start:4px solid var(--must);padding:6px 12px;margin-top:14px;color:var(--muted);font-size:.9em}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:12px 16px;text-align:start;cursor:pointer;font-size:1.05em}
.opt:hover{border-color:var(--teal)}
.opt.ok{border-color:var(--ok);background:var(--ok-s)}.opt.no{border-color:var(--bad);background:var(--bad-s)}.opt.sel{border-color:var(--teal);background:var(--teal-soft)}
.fb{margin-top:12px;font-weight:700;min-height:1.6em}.fb.ok{color:var(--ok)}.fb.no{color:var(--bad)}
.tf{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:8px;background:var(--card);flex-wrap:wrap}
.tf span{flex:1;min-width:180px}.tf button{border:2px solid var(--line);background:var(--paper);border-radius:10px;padding:5px 14px;cursor:pointer;font-weight:700}
.tf button.ok{border-color:var(--ok);background:var(--ok-s)}.tf button.no{border-color:var(--bad);background:var(--bad-s)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.match .col{display:grid;gap:8px;align-content:start}
.chipb{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;cursor:pointer;text-align:start}
.chipb.sel{border-color:var(--teal);background:var(--teal-soft)}.chipb.done{border-color:var(--ok);background:var(--ok-s);cursor:default}.chipb.no{border-color:var(--bad);background:var(--bad-s)}
.seq{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;min-height:52px;padding:8px;border:2px dashed var(--line);border-radius:12px}
.seq .chipb{cursor:default}
.blank{display:inline-block;min-width:110px;border-bottom:3px solid var(--must);text-align:center;font-weight:700;padding:0 6px}
.sortg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:12px}
.sortg .grp{border:2px dashed var(--line);border-radius:12px;padding:10px;min-height:90px}.sortg .grp h3{font-size:1em;margin-bottom:6px}
.pool{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.vocab{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:12px}
.vc{border:2px solid var(--line);border-radius:14px;padding:14px;background:var(--card);cursor:pointer;min-height:96px}
.vc b{font-family:var(--f-d);font-size:1.15em;display:block}.vc span{color:var(--muted)}
.score{font-family:var(--f-d);font-size:3.2em;color:var(--teal)}
textarea{width:100%;min-height:120px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px;font:inherit;margin-top:10px}
.nav{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:10px 16px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--card)}
.nav button{border:0;border-radius:12px;padding:11px 22px;cursor:pointer;font-weight:700;background:var(--teal-soft);color:var(--teal)}
.nav button.primary{background:var(--teal);color:#fff}.nav button:disabled{opacity:.4;cursor:default}
.nav .n{color:var(--muted);font-size:13px}
.qr{display:flex;gap:16px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:18px;flex-wrap:wrap}
.qr canvas,.qr img{width:150px;height:150px;background:#fff;border-radius:10px;padding:6px}
.center{text-align:center}
.err{max-width:520px;margin:60px auto;text-align:center;color:var(--muted)}
.s3{margin-top:18px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card)}.s3h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:8px 14px;border-bottom:1px solid var(--line)}.s3h span{color:var(--muted);font-size:.8em}.s3f{height:min(72vh,560px);display:grid;place-items:center;background:linear-gradient(#eef6f6,#d9ecec)}.s3f iframe{border:0;width:100%;height:100%;display:block}.s3go{border:0;background:var(--teal);color:#fff;border-radius:12px;padding:10px 18px;font-weight:700;cursor:pointer}.s3c{margin:0;padding:8px 14px;color:var(--muted);font-size:.9em}body.pres .s3f{height:68vh}
.brand{font-size:12px;color:var(--muted);text-align:center;margin-top:24px}.brand a{color:inherit}
/* ===== ثيم الأطفال + الكتاب المفتوح ===== */
:root,:root[data-theme=dark]{color-scheme:light}
body{background:#8fd6ff;color:#2b2a26}
.bar{background:#fff;border-bottom:0;box-shadow:0 3px 0 #ffd23f}
.bar .t{color:#5b34c9;font-size:18px}
.ibtn{background:#f3efff;border:2px solid #d9cdff;color:#5b34c9;font-weight:700;border-radius:99px}
.prog{height:8px;background:#e6f6ff}.prog i{background:#7b4dff;border-radius:0 8px 8px 0;box-shadow:0 0 8px rgba(123,77,255,.45)}
main{background:radial-gradient(120px 46px at 12% 14%,#fff 60%,transparent 62%),radial-gradient(160px 56px at 18% 11%,#fff 60%,transparent 62%),radial-gradient(130px 50px at 86% 22%,#fff 60%,transparent 62%),radial-gradient(180px 60px at 92% 18%,#fff 60%,transparent 62%),linear-gradient(#8fd6ff,#c7ecff 60%,#a6e07a 60.2%,#86cc5c);background-attachment:local;padding:26px 14px 34px}
@media (prefers-color-scheme:dark){main{background:radial-gradient(120px 46px at 12% 14%,#fff 60%,transparent 62%),radial-gradient(160px 56px at 18% 11%,#fff 60%,transparent 62%),radial-gradient(130px 50px at 86% 22%,#fff 60%,transparent 62%),linear-gradient(#8fd6ff,#c7ecff 60%,#a6e07a 60.2%,#86cc5c)}.scr{background:none}}
/* الكتاب */
.scr.book{max-width:1320px;background:#ff8a3d;border-radius:22px;padding:14px;box-shadow:0 6px 0 #d9661f,0 30px 60px rgba(30,60,90,.35);display:flex;gap:0;font-family:"Noto Naskh Arabic","IBM Plex Sans Arabic",serif;color:#2b2a26}
.book .pg{flex:1;min-width:0;background:#fffaf0;position:relative;padding:26px 30px 44px}
.book .pr{border-radius:4px 12px 12px 4px;box-shadow:inset 22px 0 26px -18px rgba(90,60,20,.35)}
.book .pl{border-radius:12px 4px 4px 12px;box-shadow:inset -22px 0 26px -18px rgba(90,60,20,.35);display:flex;flex-direction:column;justify-content:flex-start}
.book .pr:after{content:"";position:absolute;top:0;bottom:0;left:-1px;width:2px;background:linear-gradient(#e9dcc2,#d8c7a6,#e9dcc2)}
.scr.book.turn{animation:none}.book.turn .pr{animation:turnR .5s ease}.book.turn .pl{animation:turnL .5s ease}
@keyframes turnR{from{transform:perspective(1600px) rotateY(-22deg);transform-origin:left center;opacity:.3}to{transform:none;opacity:1}}
@keyframes turnL{from{transform:perspective(1600px) rotateY(22deg);transform-origin:right center;opacity:.3}to{transform:none;opacity:1}}
.book .chap{color:#a0815a}
.scr h2{color:#5b34c9;font-family:var(--f-d);font-weight:800}
.scr h3{color:#2b2a26}
.kick{color:#fff!important;background:#ff7a2f!important;font-family:var(--f-d);padding:3px 16px!important;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.k1 .kick{background:#7b4dff!important}.k2 .kick{background:#14a06f!important}.k3 .kick{background:#ff4f8b!important}.k4 .kick{background:#2f8cff!important}
.scr ul.b li::marker{color:#ff7a2f;font-size:1.2em}
.scr .ex{background:#fff4d6;border:2px dashed #ffc94a}.ex b{color:#c26a00}
.formula{background:#eef6ff;border:2px solid #9ccaff;color:#1d3d73;border-radius:14px}
.margin{color:#e0571b}
.pred{border:2px solid #d9cdff;background:#f7f4ff;border-radius:16px}.pred small{color:#7b4dff;font-weight:700;font-family:var(--f-d);font-size:.95em}
.flap .cov{background:repeating-linear-gradient(45deg,#ffe48a,#ffe48a 12px,#ffd75a 12px,#ffd75a 24px);color:#6b4b00}
.opt{border-width:3px;border-radius:18px;font-weight:600;transition:transform .12s}
.opt:hover{transform:translateY(-2px)}
.opt:nth-child(4n+1){background:#fff3d6;border-color:#ffc23d}.opt:nth-child(4n+2){background:#e6f3ff;border-color:#7cbcff}.opt:nth-child(4n+3){background:#ffe8f1;border-color:#ff9cc0}.opt:nth-child(4n+4){background:#e7f8ec;border-color:#7fd8a0}
.scr .opt.ok{background:#c9f5d6!important;border-color:#16a34a!important;animation:pop .35s}
.scr .opt.no{background:#ffe0dc!important;border-color:#e5484d!important;animation:shake .35s}
.pred label.pok{background:#c9f5d6;border-radius:10px;outline:2px solid #16a34a}
.pred label.pno{background:#ffe0dc;border-radius:10px;outline:2px solid #e5484d}
.opt.sel{background:#d7f3f1!important;border-color:var(--teal)!important;box-shadow:0 0 0 3px rgba(10,109,115,.25)}
.lbl{position:relative;margin:12px auto 0;max-width:520px;border-radius:16px;overflow:hidden;border:2px solid var(--line);background:#fff}
.lbl img{display:block;width:100%;height:auto}
.lbl .pin{position:absolute;transform:translate(-50%,-50%);min-width:44px;min-height:34px;padding:4px 10px;border-radius:99px;border:3px dashed #ff7a2f;background:rgba(255,255,255,.92);font:inherit;font-weight:800;color:#ff7a2f;cursor:pointer;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.lbl .pin.done{border-style:solid;border-color:#16a34a;background:#c9f5d6;color:#11602f;cursor:default}
.lbl .pin.no{animation:shake .35s;border-color:#e5484d}
.lblpool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
@keyframes pop{50%{transform:scale(1.04)}}@keyframes shake{25%{transform:translateX(6px)}75%{transform:translateX(-6px)}}
.vc{border:3px solid #d9cdff;border-radius:18px}.vc:nth-child(3n+2){border-color:#ffc23d}.vc:nth-child(3n+3){border-color:#7fd8a0}.vc b{color:#5b34c9}
.chipb{border-width:3px;border-radius:14px}
.score{color:#ff7a2f}
.nav{background:#fff;border-top:0;box-shadow:0 -3px 0 #ffd23f}
.nav button{border-radius:99px;font-family:var(--f-d);font-size:17px;padding:10px 26px;background:#e6f3ff;color:#2f6fd1;box-shadow:0 4px 0 #b9d8ff}
.nav button.primary{background:#ff7a2f;color:#fff;box-shadow:0 4px 0 #d9561a}
.nav button:active{transform:translateY(3px);box-shadow:none}
.snd{font-size:16px}
/* لوحة الزينة في الصفحة اليسرى */
.deco{text-align:center;padding:10px}
.deco .em{font-size:110px;line-height:1.1;display:inline-block;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-12px) rotate(-4deg)}}
.deco h3{font-family:var(--f-d);color:#5b34c9;font-size:1.6em;margin-top:8px}
.deco p{color:#7a6a52;margin:6px 0 0;font-size:1.1em}
.stars{font-size:34px;letter-spacing:4px;margin-top:10px}
.stars i{font-style:normal;opacity:.22;filter:grayscale(1)}.stars i.on{opacity:1;filter:none}
/* المجسم ينبثق من الكتاب */
.s3{border:0!important;border-radius:20px!important;background:#fff!important;box-shadow:0 4px 0 #e5d6b5}
.s3h{background:linear-gradient(90deg,#7b4dff,#2f8cff);color:#fff!important;border:0!important}.s3h b{color:#fff}.s3h span{color:#e8e2ff!important}
.s3f{background:linear-gradient(#7cc8ff,#e6f7ff)!important;position:relative}
.s3play{position:absolute;inset:auto 0 0 0;top:0;display:flex;align-items:center;justify-content:center;background:rgba(20,30,60,.18);border:0;cursor:pointer;z-index:3}
.s3play b{background:#ff7a2f;color:#fff;font-family:var(--f-d);font-size:22px;padding:12px 26px;border-radius:99px;box-shadow:0 6px 0 #d9561a,0 14px 30px rgba(0,0,0,.25);display:flex;gap:10px;align-items:center}
.s3.live .s3play{display:none}
@media(min-width:1100px){
}
@media(max-width:1099px){
 .scr.book{display:block;padding:10px}
 .book .pg{border-radius:12px!important;box-shadow:none}
 .book .pr:after{display:none}
 .book .pl{margin-top:10px}
 .book .pl.only-deco{display:none}
 .book .pr .pgno{display:none}
}
@media(max-width:600px){.book .pg{padding:20px 16px 38px}}
.confetti{position:fixed;pointer-events:none;z-index:99;font-size:22px;animation:fall 1.4s ease-out forwards}
@keyframes fall{to{transform:translate(var(--dx),var(--dy)) rotate(540deg);opacity:0}}

.book .margin{position:static!important;width:auto!important;left:auto!important;top:auto!important;transform:none!important;border-inline-start:3px solid #ffb27a!important;background:#fff6ec;border-radius:10px}
.prog i{transition:width .4s}
.s3h{align-items:center}.s3fs{margin-inline-start:auto;border:0;background:rgba(255,255,255,.22);color:#fff;border-radius:99px;padding:3px 12px;font-weight:700;cursor:pointer;font-family:var(--f-d)}.s3fs:hover{background:rgba(255,255,255,.35)}
.s3:fullscreen,.s3.fsx{transform:none!important;border-radius:0!important;display:flex;flex-direction:column;width:100vw;height:100vh;background:#cdeeff!important}
.s3:fullscreen .s3f,.s3.fsx .s3f{flex:1;height:auto!important}.s3.fsx{position:fixed!important;inset:0;z-index:90}
body.fsxon{overflow:hidden}body.fsxon main{perspective:none!important;overflow:visible}body.fsxon .book .pg,body.fsxon .scr{animation:none!important;transform:none!important}
.party{position:fixed;inset:0;pointer-events:none;z-index:95;overflow:hidden;background:radial-gradient(circle,rgba(255,236,150,.35),transparent 60%)}
.party-msg{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);font-family:var(--f-d);font-weight:800;font-size:clamp(40px,8vw,96px);color:#fff;-webkit-text-stroke:3px #7b4dff;text-shadow:0 6px 0 #5b34c9,0 14px 30px rgba(0,0,0,.25);white-space:nowrap;animation:partyIn .6s cubic-bezier(.2,1.6,.4,1),partyOut .5s 2.6s forwards}
@keyframes partyIn{from{transform:translate(-50%,-50%) scale(.2) rotate(-12deg);opacity:0}}@keyframes partyOut{to{opacity:0;transform:translate(-50%,-80%) scale(.9)}}
.cf{position:absolute;top:-30px;width:11px;height:16px;border-radius:3px;animation:cfall linear forwards}.cf.em{width:auto;height:auto;font-size:26px;font-style:normal;background:none}
@keyframes cfall{to{transform:translate(var(--x),110vh) rotate(var(--r))}}
