<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>درس تفاعلي — مجودة</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Baloo+Bhaijaan+2:wght@600;700;800&family=Noto+Naskh+Arabic:wght@400;600;700&family=Aref+Ruqaa:wght@400;700&display=swap">
<style>
:root{--ink:#0b3d40;--muted:#5b7476;--line:#d9e6e6;--paper:#f5f9f8;--card:#fff;--teal:#0a6d73;--teal-soft:#e3f1f0;--must:#e1a23a;--must-soft:#fbf1df;--ok:#1f7a43;--ok-s:#e4f4ea;--bad:#c4513f;--bad-s:#fbe9e7;
 --f-d:"Baloo Bhaijaan 2","IBM Plex Sans Arabic",Tahoma,sans-serif;--f-b:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;--fs:1}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--ink:#e4efee;--muted:#9db3b2;--line:#24393a;--paper:#0d1717;--card:#132222;--teal:#4fb7b5;--teal-soft:#16302f;--must-soft:#2c2414;--ok-s:#132b1e;--bad-s:#341b19;color-scheme:dark}}
:root[data-theme=dark]{--ink:#e4efee;--muted:#9db3b2;--line:#24393a;--paper:#0d1717;--card:#132222;--teal:#4fb7b5;--teal-soft:#16302f;--must-soft:#2c2414;--ok-s:#132b1e;--bad-s:#341b19;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-b);font-size:calc(16px * var(--fs));line-height:1.7;display:flex;flex-direction:column}
body.pres{--fs:1.35}
h1,h2,h3{font-family:var(--f-d);margin:0;line-height:1.35}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--must);outline-offset:2px}
.bar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--card)}
.bar .t{font-family:var(--f-d);font-weight:700;font-size:16px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{height:5px;background:var(--line)}.prog i{display:block;height:100%;background:var(--teal);transition:width .3s}
.ibtn{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:5px 11px;cursor:pointer;font-size:13px;white-space:nowrap}
main{flex:1;overflow:auto;padding:22px 12px 30px;background:radial-gradient(circle at 30% 0,#e9e3d6,#d8cfbd);perspective:1800px}
.scr{max-width:900px;margin:0 auto;background:#fffdf8;color:#2b2a26;border-radius:6px 14px 14px 6px;box-shadow:0 1px 0 #e7dfcf,0 18px 40px rgba(60,45,20,.18),inset 14px 0 18px -14px rgba(60,45,20,.25);padding:28px 30px 34px;position:relative;font-family:"Noto Naskh Arabic","IBM Plex Sans Arabic",serif;transform-origin:right center}
.scr.turn{animation:turn .45s ease}@keyframes turn{from{transform:rotateY(-14deg);opacity:.2}to{transform:none;opacity:1}}
.chap{display:flex;justify-content:space-between;font-family:var(--f-b);font-size:12px;color:#8a7d63;border-bottom:1px solid #eee4d1;padding-bottom:8px;margin-bottom:14px}
.pgno{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-family:var(--f-b);font-size:12px;color:#a2967c}
.formula{border:1px solid #d9cfba;background:#fbf6ea;border-radius:10px;padding:14px 16px;margin-top:14px;text-align:center;direction:ltr;font-family:"Cambria Math","Times New Roman",serif;font-size:1.35em;color:#1f1d19}
.margin{font-family:"Aref Ruqaa",serif;color:#b0651c;font-size:1.15em;transform:rotate(-2deg);border-inline-start:2px dashed #e4c79a;padding:4px 12px;margin-top:14px}
@media(min-width:1360px){.margin{position:absolute;left:-210px;top:110px;width:190px;border:0;transform:rotate(-4deg)}}
.pred{border:1px solid #e3d8c2;border-radius:12px;padding:12px 16px;margin-top:16px;background:#fff}
.pred small{color:#8a7d63;font-family:var(--f-b)}.pred h3{font-size:1.1em;margin:4px 0 8px;font-family:"Noto Naskh Arabic",serif}
.pred label{display:flex;gap:8px;align-items:center;padding:4px 0;cursor:pointer}.pred input{width:18px;height:18px;accent-color:#0a6d73}
.flap{margin-top:10px;position:relative;border-radius:10px;overflow:hidden;min-height:64px;background:#f3f8f2;border:1px solid #cfe3cf}
.flap .ans{padding:12px 14px}.flap .cov{position:absolute;inset:0;background:repeating-linear-gradient(45deg,#fbf1d6,#fbf1d6 10px,#f7e8c2 10px,#f7e8c2 20px);display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;font-weight:700;color:#6b5420;transition:transform .5s ease;transform-origin:top}
.flap.open .cov{transform:rotateX(85deg) translateY(-30px);opacity:0;pointer-events:none}
.scr .ex{background:#f1f7f6}.scr{color-scheme:light}.scr .s3{background:#fff;border-color:#e3d8c2}.scr .s3h{color:#2b2a26}.scr .s3h span,.scr .s3c{color:#7a7262}.scr .kick{background:#f6ead0;color:#5a4a26}.scr .opt,.scr .tf,.scr .chipb,.scr .vc{background:#fff;color:#2b2a26}.scr .tn{font-family:var(--f-b)}.scr .qr{background:#fff;border-color:#e3d8c2;color:#2b2a26}.scr .qr .nm{color:#7a7262!important}
@media(max-width:600px){.scr{padding:20px 16px 34px}}
@media (prefers-color-scheme:dark){main{background:#151a19}.scr{background:#fbf8f1}}
.kick{display:inline-block;background:var(--must-soft);color:var(--ink);border-radius:99px;padding:2px 14px;font-weight:700;font-size:.85em;margin-bottom:10px}
.scr h2{font-size:1.8em;margin-bottom:12px}
.scr ul.b{padding:0 1.2em;margin:0}.scr ul.b li{margin:.45em 0;font-size:1.15em}
.ex{background:var(--teal-soft);border-radius:14px;padding:12px 16px;margin-top:16px}.ex b{color:var(--teal)}
.tn{border-inline-start:4px solid var(--must);padding:6px 12px;margin-top:14px;color:var(--muted);font-size:.9em}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:12px 16px;text-align:start;cursor:pointer;font-size:1.05em}
.opt:hover{border-color:var(--teal)}
.opt.ok{border-color:var(--ok);background:var(--ok-s)}.opt.no{border-color:var(--bad);background:var(--bad-s)}.opt.sel{border-color:var(--teal);background:var(--teal-soft)}
.fb{margin-top:12px;font-weight:700;min-height:1.6em}.fb.ok{color:var(--ok)}.fb.no{color:var(--bad)}
.tf{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:8px;background:var(--card);flex-wrap:wrap}
.tf span{flex:1;min-width:180px}.tf button{border:2px solid var(--line);background:var(--paper);border-radius:10px;padding:5px 14px;cursor:pointer;font-weight:700}
.tf button.ok{border-color:var(--ok);background:var(--ok-s)}.tf button.no{border-color:var(--bad);background:var(--bad-s)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.match .col{display:grid;gap:8px;align-content:start}
.chipb{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;cursor:pointer;text-align:start}
.chipb.sel{border-color:var(--teal);background:var(--teal-soft)}.chipb.done{border-color:var(--ok);background:var(--ok-s);cursor:default}.chipb.no{border-color:var(--bad);background:var(--bad-s)}
.seq{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;min-height:52px;padding:8px;border:2px dashed var(--line);border-radius:12px}
.seq .chipb{cursor:default}
.blank{display:inline-block;min-width:110px;border-bottom:3px solid var(--must);text-align:center;font-weight:700;padding:0 6px}
.sortg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:12px}
.sortg .grp{border:2px dashed var(--line);border-radius:12px;padding:10px;min-height:90px}.sortg .grp h3{font-size:1em;margin-bottom:6px}
.pool{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.vocab{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:12px}
.vc{border:2px solid var(--line);border-radius:14px;padding:14px;background:var(--card);cursor:pointer;min-height:96px}
.vc b{font-family:var(--f-d);font-size:1.15em;display:block}.vc span{color:var(--muted)}
.score{font-family:var(--f-d);font-size:3.2em;color:var(--teal)}
textarea{width:100%;min-height:120px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px;font:inherit;margin-top:10px}
.nav{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:10px 16px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--card)}
.nav button{border:0;border-radius:12px;padding:11px 22px;cursor:pointer;font-weight:700;background:var(--teal-soft);color:var(--teal)}
.nav button.primary{background:var(--teal);color:#fff}.nav button:disabled{opacity:.4;cursor:default}
.nav .n{color:var(--muted);font-size:13px}
.qr{display:flex;gap:16px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:18px;flex-wrap:wrap}
.qr canvas,.qr img{width:150px;height:150px;background:#fff;border-radius:10px;padding:6px}
.center{text-align:center}
.err{max-width:520px;margin:60px auto;text-align:center;color:var(--muted)}
.s3{margin-top:18px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card)}.s3h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:8px 14px;border-bottom:1px solid var(--line)}.s3h span{color:var(--muted);font-size:.8em}.s3f{height:min(62vh,460px);display:grid;place-items:center;background:linear-gradient(#eef6f6,#d9ecec)}.s3f iframe{border:0;width:100%;height:100%;display:block}.s3go{border:0;background:var(--teal);color:#fff;border-radius:12px;padding:10px 18px;font-weight:700;cursor:pointer}.s3c{margin:0;padding:8px 14px;color:var(--muted);font-size:.9em}body.pres .s3f{height:68vh}
.brand{font-size:12px;color:var(--muted);text-align:center;margin-top:24px}.brand a{color:inherit}
</style>
</head>
<body>
<div class="bar"><span class="t" id="ttl">درس تفاعلي</span><button class="ibtn" id="bPres" hidden>عرض على السبورة</button><button class="ibtn" id="bQr" hidden>QR للطلاب</button></div>
<div class="prog"><i id="pg" style="width:0"></i></div>
<main><div class="scr" id="scr"><p class="err">جاري تحميل الدرس…</p></div></main>
<nav class="nav"><button id="prev">السابق</button><span class="n" id="cnt"></span><button class="primary" id="next">التالي</button></nav>
<script src="../qrcode.min.js"></script>
<script>
(function(){
"use strict";
var P=new URLSearchParams(location.search),ID=P.get("id"),TEACH=P.get("t")==="1",API=(P.get("api")||"https://rsvp.majoodah.com")+"/api/dars";
var $=function(s,r){return (r||document).querySelector(s)},$$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var AN=function(n){return String(n).replace(/\d/g,function(c){return "٠١٢٣٤٥٦٧٨٩"[c]})};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
var L,S=[],cur=0,QZ={},ORD={};
function mixO(opts,key){if(!ORD[key])ORD[key]=shuffle(opts.map(function(_,k){return k}));return ORD[key].map(function(k){return '<button class="opt" data-k="'+k+'">'+esc(opts[k])+'</button>'}).join("")}
var src=P.get("demo")?"../sample.json":API+"/lesson/"+encodeURIComponent(ID||"");
fetch(src).then(function(r){if(!r.ok)throw r;return r.json()}).then(function(j){L=j.lesson||j;build();show(0)}).catch(function(){$("#scr").innerHTML='<div class="err"><h2>الدرس غير موجود</h2><p>تأكد من الرابط، أو اطلبه من معلمك من جديد.</p></div>';$(".nav").hidden=true});
function studentUrl(){return location.origin+location.pathname+(ID?"?id="+encodeURIComponent(ID):"?demo=1")+(P.get("api")?"&api="+encodeURIComponent(P.get("api")):"")}
function build(){
 document.title=L.title+" — درس تفاعلي";$("#ttl").textContent=L.title;
 if(TEACH){$("#bPres").hidden=false;$("#bQr").hidden=false}
 S.push(cover);
 if(L.warmup&&L.warmup.prompt)S.push(warm);
 if(L.vocabulary&&L.vocabulary.length)S.push(vocab);
 (L.slides||[]).forEach(function(s,i){S.push(function(){return slide(s,i)})});
 (L.activities||[]).forEach(function(a,i){S.push(function(){return act(a,i)})});
 (L.quiz||[]).forEach(function(q,i){S.push(function(){return quiz(q,i)})});
 if(L.quiz&&L.quiz.length)S.push(result);
 if(L.exit_ticket)S.push(exitT);
}
function show(i){if(!S.length)return;cur=Math.max(0,Math.min(S.length-1,i));var el=$("#scr");el.innerHTML='<div class="chap"><span>'+esc([L.subject,L.grade].filter(Boolean).join(" · "))+'</span><span>'+esc(L.title)+'</span></div>';var node=S[cur]();el.appendChild(node);el.insertAdjacentHTML("beforeend",'<div class="pgno">'+AN(cur+1)+'</div>');el.classList.remove("turn");void el.offsetWidth;el.classList.add("turn");
 $("#pg").style.width=((cur+1)/S.length*100)+"%";$("#cnt").textContent=AN(cur+1)+" / "+AN(S.length);$("#prev").disabled=cur===0;$("#next").textContent=cur===S.length-1?"من البداية":"التالي";
 document.querySelector("main").scrollTop=0}
$("#prev").addEventListener("click",function(){show(cur-1)});$("#next").addEventListener("click",function(){show(cur===S.length-1?0:cur+1)});
document.addEventListener("keydown",function(e){if(/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;if(e.key==="ArrowLeft"||e.key===" "){e.preventDefault();show(cur===S.length-1?cur:cur+1)}if(e.key==="ArrowRight")show(cur-1)});
$("#bPres").addEventListener("click",function(){document.body.classList.toggle("pres");var d=document.documentElement;if(document.body.classList.contains("pres")&&d.requestFullscreen)d.requestFullscreen().catch(function(){});else if(document.fullscreenElement)document.exitFullscreen()});
$("#bQr").addEventListener("click",function(){var u=studentUrl(),d=div('<div class="scr center"><h2>افتح الدرس من جوالك</h2>'+qrHTML(u,360)+'<p dir="ltr" style="word-break:break-all">'+esc(u)+'</p><button class="ibtn" id="qrBack">رجوع للدرس</button></div>');$("#scr").innerHTML="";$("#scr").appendChild(d);$("#qrBack").addEventListener("click",function(){show(cur)})});
function qrHTML(u,px){try{var q=qrcode(0,"M");q.addData(u);q.make();return '<img alt="QR" style="width:'+px+'px;height:'+px+'px;max-width:80vw;max-height:80vw;background:#fff;border-radius:12px;padding:10px" src="'+q.createDataURL(8,2)+'">'}catch(e){return ""}}
function div(h){var d=document.createElement("div");d.innerHTML=h;return d}
function cover(){var o=(L.objectives||[]).map(function(x){return "<li>"+esc(x)+"</li>"}).join("");
 var d=div('<span class="kick">'+esc([L.subject,L.grade].filter(Boolean).join(" · ")||"درس تفاعلي")+'</span><h2 style="font-size:2.2em">'+esc(L.title)+'</h2>'+(L.summary?'<p style="font-size:1.1em;color:var(--muted)">'+esc(L.summary)+'</p>':'')+(o?'<h3 style="margin-top:14px">أهداف الدرس</h3><ul class="b">'+o+'</ul>':'')+
  (TEACH?'<div class="qr">'+qrHTML(studentUrl(),150)+'<div><b>رابط الطلاب</b><p class="nm" style="margin:4px 0 0;color:var(--muted)">يفتح الطلاب الدرس بمسح الرمز، ويحلّون الأنشطة والاختبار من جوالاتهم.</p></div></div>':'')+'<p class="brand">صُنع بـ <a href="https://dars.majoodah.com" target="_blank" rel="noopener">الدرس التفاعلي · مجودة</a></p>');return d}
function warm(){var w=L.warmup,d=div('<span class="kick">تهيئة</span><h2>'+esc(w.prompt)+'</h2>'+(w.options&&w.options.length?'<div class="opts">'+w.options.map(function(o,i){return '<button class="opt" data-i="'+i+'">'+esc(o)+'</button>'}).join("")+'</div>':'<p style="color:var(--muted)">ناقشوا الإجابة قبل ما نبدأ الدرس 💬</p>'));
 $$(".opt",d).forEach(function(b){b.addEventListener("click",function(){$$(".opt",d).forEach(function(x){x.classList.remove("sel")});b.classList.add("sel")})});return d}
function vocab(){var d=div('<span class="kick">مفردات الدرس</span><h2>اضغط على البطاقة لتعرف المعنى</h2><div class="vocab">'+L.vocabulary.map(function(v){return '<div class="vc" tabindex="0"><b>'+esc(v.term)+'</b><span hidden>'+esc(v.meaning)+'</span></div>'}).join("")+'</div>');
 $$(".vc",d).forEach(function(c){function t(){var s=$("span",c);s.hidden=!s.hidden}c.addEventListener("click",t);c.addEventListener("keydown",function(e){if(e.key==="Enter")t()})});return d}
function slide(s,i){var d=slide0(s,i),sc=scenesFor(i);if(s.formula)d.insertAdjacentHTML("beforeend",'<div class="formula">'+esc(s.formula)+'</div>');if(s.margin_note)d.insertAdjacentHTML("beforeend",'<div class="margin">'+esc(s.margin_note)+'</div>');
 var pr=s.predict;if(pr&&pr.question&&pr.options&&pr.options.length)d.appendChild(predict(pr,i));sc.forEach(function(x){d.appendChild(sceneBox(x))});return d}
function predict(pr,i){var w=div('<div class="pred"><small>توقّع قبل أن تجرّب</small><h3>'+esc(pr.question)+'</h3>'+pr.options.map(function(o,k){return '<label><input type="radio" name="pr'+i+'" value="'+k+'"> '+esc(o)+'</label>'}).join("")+'<div class="flap"><div class="ans"><b>'+(pr.answer_index>=0&&pr.options[pr.answer_index]!=null?"الإجابة: "+esc(pr.options[pr.answer_index]):"")+'</b><div>'+esc(pr.reveal||"")+'</div></div><div class="cov" role="button" tabindex="0">✋ ارفع الورقة لترى الإجابة</div></div></div>');
 var f=w.querySelector(".flap"),c=w.querySelector(".cov");function open(){var ch=w.querySelector("input:checked");if(!ch&&!TEACH){c.textContent="✍️ اختر توقعك أولاً";return}f.classList.add("open")}
 c.addEventListener("click",open);c.addEventListener("keydown",function(e){if(e.key==="Enter")open()});return w}
function slide0(s,i){return div('<span class="kick">الشرح · '+AN(i+1)+'/'+AN(L.slides.length)+'</span><h2>'+esc(s.title)+'</h2><ul class="b">'+(s.bullets||[]).map(function(b){return "<li>"+esc(b)+"</li>"}).join("")+'</ul>'+(s.example?'<div class="ex"><b>مثال: </b>'+esc(s.example)+'</div>':'')+(TEACH&&s.teacher_note?'<div class="tn">💡 للمعلم: '+esc(s.teacher_note)+'</div>':''))}
function scenesFor(i){var n=(L.slides||[]).length;return (L.scenes||[]).filter(function(x){var k=Math.max(0,Math.min(n-1,x.slide_index|0));return k===i&&x.code})}
function sceneBox(x){var w=div('<div class="s3"><div class="s3h"><b>🧊 '+esc(x.title||"مجسم ثلاثي الأبعاد")+'</b><span>حرّكه بإصبعك أو بالفأرة</span></div><div class="s3f"><button class="s3go">اعرض المجسم ثلاثي الأبعاد</button></div>'+(x.caption?'<p class="s3c">'+esc(x.caption)+'</p>':'')+'</div>');
 var f=w.querySelector(".s3f");function load(){f.innerHTML="";var fr=document.createElement("iframe");fr.setAttribute("sandbox","allow-scripts");fr.setAttribute("title",x.title||"مجسم");f.innerHTML='<span style="color:var(--muted)">يجهّز المجسم…</span>';kitText().then(function(kt){f.innerHTML="";fr.srcdoc=sceneDoc(x.code,kt);f.appendChild(fr)},function(){KIT=null;f.innerHTML='<button class="s3go">تعذّر التحميل، أعد المحاولة</button>';f.querySelector(".s3go").onclick=load})}
 w.querySelector(".s3go").addEventListener("click",load);if(TEACH||window.innerWidth>700)setTimeout(load,50);return w}
var KIT=null;function kitText(){if(!KIT)KIT=fetch("scene3d.js?v=5").then(function(r){if(!r.ok)throw 0;return r.text()});return KIT}
